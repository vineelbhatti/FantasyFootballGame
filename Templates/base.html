<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b132b">
    <title>{% block title %}Sunday Studio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" aria-label="Sunday Studio home">
            <span class="brand-mark">SS</span>
            <span>Sunday Studio</span>
        </a>
        <nav class="main-nav" aria-label="Primary navigation">
            <a href="{{ url_for('draft') }}">Draft</a>
            <a href="{{ url_for('home_page') }}">League Hub</a>
            <a href="{{ url_for('set_lineup') }}">Lineup</a>
            <a href="{{ url_for('sim_week') }}">Scores</a>
        </nav>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
