{% extends "base.html" %}
{% block title %}Set Lineup · Sunday Studio{% endblock %}
{% block content %}
<section class="hero"><p class="eyebrow">Week lineup</p><h1>Choose your starters.</h1><p class="lede">Projections include player role and the upcoming defensive matchup.</p></section>
<section class="card">
    <div class="section-heading"><div><h2>Starting lineup</h2><p>Pick one QB, two RBs, and two WRs.</p></div><span class="pill">{{ current_week }}</span></div>
    <form method="POST" action="{{ url_for('submit_lineup') }}">
        <div class="lineup-grid">
            <div class="field"><label for="qb">Quarterback</label><select name="qb" id="qb" required>{% for player in qb_players %}<option value="{{ player['Player'] }}">{{ player['Player'] }} · {{ player['weekly_pred_pts'] }} projected pts</option>{% endfor %}</select></div>
            <div class="field"><label for="rb1">Running back 1</label><select name="rb1" id="rb1" required>{% for player in rb_players %}<option value="{{ player['Player'] }}">{{ player['Player'] }} · {{ player['weekly_pred_pts'] }} projected pts</option>{% endfor %}</select></div>
            <div class="field"><label for="rb2">Running back 2</label><select name="rb2" id="rb2" required>{% for player in rb_players %}<option value="{{ player['Player'] }}">{{ player['Player'] }} · {{ player['weekly_pred_pts'] }} projected pts</option>{% endfor %}</select></div>
            <div class="field"><label for="wr1">Wide receiver 1</label><select name="wr1" id="wr1" required>{% for player in wr_players %}<option value="{{ player['Player'] }}">{{ player['Player'] }} · {{ player['weekly_pred_pts'] }} projected pts</option>{% endfor %}</select></div>
            <div class="field"><label for="wr2">Wide receiver 2</label><select name="wr2" id="wr2" required>{% for player in wr_players %}<option value="{{ player['Player'] }}">{{ player['Player'] }} · {{ player['weekly_pred_pts'] }} projected pts</option>{% endfor %}</select></div>
        </div>
        <button type="submit">Save starting lineup</button>
    </form>
</section>
{% endblock %}
